services:
  db:
    image: postgres:15-alpine
    container_name: openrouter-scouter-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: scouter
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  scouter:
    depends_on:
      - db
    build: .
    container_name: openrouter-scouter
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    env_file:
      - .env
    environment:
      - OPENROUTER_SCOUT_WEB_HOST=0.0.0.0
      - OPENROUTER_SCOUT_WEB_PORT=8000
      - OPENROUTER_SCOUT_DB_URI=postgresql://postgres:postgrespassword@db:5432/scouter
    restart: unless-stopped

volumes:
  db_data:
