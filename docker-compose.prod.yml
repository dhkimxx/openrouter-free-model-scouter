version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: openrouter-scouter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: scouter
    volumes:
      - db_data:/var/lib/postgresql/data

  scouter:
    depends_on:
      - db
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openrouter-scouter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OPENROUTER_SCOUT_WEB_HOST=0.0.0.0
      - OPENROUTER_SCOUT_WEB_PORT=8000
      - OPENROUTER_SCOUT_DB_URI=postgresql://postgres:postgrespassword@db:5432/scouter
    volumes:
      - ./results:/app/results
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  db_data:
