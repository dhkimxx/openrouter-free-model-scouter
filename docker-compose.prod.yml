version: "3.9"

services:
  scouter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openrouter-scouter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OPENROUTER_SCOUT_WEB_HOST=0.0.0.0
      - OPENROUTER_SCOUT_WEB_PORT=8000
    volumes:
      - ./results:/app/results
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
