<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Free Model Scouter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold">OpenRouter Free Model Scouter</h1>
            <div id="last-updated" class="text-sm text-gray-500"></div>
        </header>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                <h3 class="text-sm font-semibold text-gray-500 uppercase">Total Models</h3>
                <p id="summary-total" class="text-3xl font-bold mt-2">-</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow border-l-4 border-green-500">
                <h3 class="text-sm font-semibold text-gray-500 uppercase">Healthy</h3>
                <p id="summary-healthy" class="text-3xl font-bold mt-2 text-green-500">-</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow border-l-4 border-yellow-500">
                <h3 class="text-sm font-semibold text-gray-500 uppercase">Degraded</h3>
                <p id="summary-degraded" class="text-3xl font-bold mt-2 text-yellow-500">-</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow border-l-4 border-red-500">
                <h3 class="text-sm font-semibold text-gray-500 uppercase">Down</h3>
                <p id="summary-down" class="text-3xl font-bold mt-2 text-red-500">-</p>
            </div>
        </div>

        <!-- Important Events -->
        <section class="bg-white dark:bg-gray-800 rounded-lg shadow mb-8 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <div>
                    <h2 class="text-lg font-bold">Important Events</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400">Free-model list changes from the last 30 days</p>
                </div>
                <button id="events-view-all" class="text-blue-500 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-200 text-sm font-semibold">View all</button>
            </div>
            <div id="important-events-list" class="divide-y divide-gray-200 dark:divide-gray-700"></div>
        </section>

        <!-- Search Bar -->
        <div class="mb-6 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                </svg>
            </div>
            <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white dark:bg-gray-800 dark:border-gray-700 placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-gray-900 dark:text-gray-100" placeholder="Search models (e.g. llama, google)...">
        </div>

        <!-- Models Table -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="model-table w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <colgroup>
                        <col class="model-id-column">
                        <col class="model-status-column">
                        <col class="model-uptime-column">
                        <col class="model-latency-column">
                        <col class="model-trend-column">
                        <col class="model-action-column">
                    </colgroup>
                    <thead class="bg-gray-50 dark:bg-gray-700">
                        <tr>
                            <th class="model-id-column sticky left-0 z-20 bg-gray-50 dark:bg-gray-700 px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider shadow-[8px_0_12px_-12px_rgba(0,0,0,0.55)] sm:px-6">Model ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Uptime (24h)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Avg Latency</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Trend (24h)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Action</th>
                        </tr>
                    </thead>
                    <tbody id="models-tbody" class="divide-y divide-gray-200 dark:divide-gray-700">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg w-11/12 md:w-3/4 lg:w-2/3 max-h-[90vh] flex flex-col">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-bold">Model History</h3>
                <button id="modal-close" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <div class="flex space-x-2 mb-4 justify-center" id="period-selector">
                    <button onclick="openHistory(window.currentModelId, '1d')" data-period="1d" class="px-3 py-1 rounded bg-blue-600 text-white text-sm font-semibold period-btn">1 Day</button>
                    <button onclick="openHistory(window.currentModelId, '1w')" data-period="1w" class="px-3 py-1 rounded bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-semibold period-btn">1 Week</button>
                    <button onclick="openHistory(window.currentModelId, '1m')" data-period="1m" class="px-3 py-1 rounded bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-semibold period-btn">1 Month</button>
                    <button onclick="openHistory(window.currentModelId, '1y')" data-period="1y" class="px-3 py-1 rounded bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-semibold period-btn">1 Year</button>
                </div>
                <div id="chart-container" style="width: 100%; height: 400px;"></div>
                <div class="mt-6 border-t border-gray-200 dark:border-gray-700 pt-4">
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="font-bold">Health Events</h4>
                        <button id="health-events-load-more" class="hidden text-blue-500 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-200 text-sm font-semibold">Load more</button>
                    </div>
                    <div id="health-events-list" class="divide-y divide-gray-200 dark:divide-gray-700 rounded border border-gray-200 dark:border-gray-700 overflow-hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Events Modal -->
    <div id="events-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg w-11/12 md:w-3/4 lg:w-1/2 max-h-[90vh] flex flex-col">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <div>
                    <h3 class="text-xl font-bold">Important Events</h3>
                    <p class="text-sm text-gray-500 dark:text-gray-400">Added and removed free models</p>
                </div>
                <button id="events-modal-close" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="events-modal-list" class="flex-1 overflow-y-auto divide-y divide-gray-200 dark:divide-gray-700"></div>
            <div class="p-4 border-t border-gray-200 dark:border-gray-700">
                <button id="events-modal-load-more" class="w-full py-2 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-sm font-semibold">Load more</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
